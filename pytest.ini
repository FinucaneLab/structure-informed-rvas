[pytest]
# Without this, pytest's default python_files pattern (test_*.py *_test.py)
# collects the root-level mutation_rate_test.py and scan_test.py as test
# modules. Both import from the repository root, which pytest does not put on
# sys.path, so a bare `pytest` aborts with two collection errors before any
# test runs. It happens not to fire in a checkout whose directory name is not
# a valid identifier -- hyphens make pytest insert the rootdir instead -- so it
# reproduces on a clean clone and in CI but not necessarily locally.
testpaths = tests
python_files = test_*.py
